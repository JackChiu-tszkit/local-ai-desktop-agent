[project]
name = "local-ai-desktop-agent"
version = "0.1.0"
description = "Local-first Windows desktop agent with tool-first automation and explicit user approval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "langgraph>=0.2.40",
    "langchain-core>=0.3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pywinauto>=0.6.8",
    "pyautogui>=0.9.54",
    "pywin32>=306",
    "psutil>=5.9",
    "mss>=9.0",
    "Pillow>=10.0",
    "send2trash>=1.8",
    "keyring>=25.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
local-ai-agent = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
